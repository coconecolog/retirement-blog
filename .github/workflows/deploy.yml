name: Build and Deploy to Cloudflare Pages

on:
  # 30分おきに自動実行し、Notionの更新をチェックして再ビルド・再公開します
  schedule:
    - cron: '*/30 * * * *'
  # コードを push したときも実行
  push:
    branches: [main]
  # GitHubの「Actions」タブから手動実行したいとき用
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # package.json に新しい依存パッケージ（@google-analytics/data）を追加した際、
        # package-lock.json を手元で更新して渡す運用が難しい（巨大ファイルのためGitHub上での貼り付けにリスクがある）ので、
        # ロックファイルとの厳密な一致を要求する npm ci ではなく npm install を使う。
        run: npm install

      - name: Build site (Notionから最新記事を取得)
        run: npm run build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_CLARITY_PROJECT_ID: ${{ secrets.PUBLIC_CLARITY_PROJECT_ID }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.PUBLIC_GOOGLE_SITE_VERIFICATION }}

      - name: Deploy to Cloudflare Pages (direct upload)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main
